spring.application.name=restaurantManagementSystem

spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JDBC_DDL_AUTO}
spring.jpa.show-sql=${JDBC_SHOW_SQL}

spring.jwt.secret-key=${JWT_SECRET}

spring.mail.host=${SMTP_MAIL_HOST}
spring.mail.port=${SMTP_MAIL_PORT}
spring.mail.username=${SMTP_MAIL_USERNAME}
spring.mail.password=${SMTP_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${SMTP_PROPERTIES_MAIL_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_PROPERTIES_MAIL_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_PROPERTIES_MAIL_SSL_TRUST}
spring.mail.properties.mail.debug=${SMTP_PROPERTIES_MAIL_DEBUG}